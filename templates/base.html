<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DB Workflow — Orquestrador</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0f1115;color:#e8eaf0}
nav{background:#1a1e27;padding:12px 20px;display:flex;gap:16px}
nav a{color:#9ec1ff;text-decoration:none;font-weight:600}
main{padding:20px;max-width:1100px;margin:auto}
.card{background:#1a1e27;border:1px solid #2a3040;border-radius:10px;padding:14px;margin:10px 0}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #2a3040;text-align:left;font-size:14px}
.flash-ok{background:#123d22;padding:8px;border-radius:6px}
.flash-error{background:#4a1620;padding:8px;border-radius:6px}
button,a.btn{background:#2f6fed;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;text-decoration:none;font-size:13px}
input,select,textarea{width:100%;padding:8px;margin:4px 0 10px;background:#0f1115;color:#eee;border:1px solid #333;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
code{font-size:12px}
</style></head>
<body><nav>
<a href="/">Dashboard</a><a href="/jobs">Jobs</a><a href="/submit">+ Ad-hoc</a><a href="/clusters">Clusters</a>
<a href="/workspace">Workspace</a><a href="/workspace/import">Importar</a><a href="/files">Arquivos</a><a href="/sql">SQL</a>
</nav><main>
{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}
<div class="flash-{{c}}">{{m}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main></body></html>
