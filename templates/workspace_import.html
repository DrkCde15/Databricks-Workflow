{% extends "base.html" %}{% block content %}
<h2>Importar notebook / arquivo <small>(limite 10MB)</small></h2>
<div class="card"><form method="post" enctype="multipart/form-data">
<label>Arquivo local (.py, .ipynb, .sql, .html...)</label><input type="file" name="file" required>
<label>Path destino no workspace (absoluto)</label>
<input name="path" required placeholder="/Workspace/Users/voce@empresa.com/MeuNotebook">
<label>Formato</label><select name="format">
<option>SOURCE</option><option>AUTO</option><option>JUPYTER</option>
<option>HTML</option><option>DBC</option><option>RAW</option></select>
<label>Linguagem (só p/ SOURCE notebook)</label><select name="language">
<option value="">—</option><option>PYTHON</option><option>SQL</option>
<option>SCALA</option><option>R</option></select>
<label><input type="checkbox" name="overwrite" checked style="width:auto"> Sobrescrever</label>
<button>Enviar</button></form></div>
<p>Maior que 10MB? Use <a href="/files">/files</a> (Volumes, até 5 GiB).</p>{% endblock %}
