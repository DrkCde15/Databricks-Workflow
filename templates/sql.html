{% extends "base.html" %}{% block content %}
<h2>SQL — Statement Execution</h2>
<form method="post">
<label>Warehouse</label><select name="warehouse_id">{% for w in warehouses %}
<option value="{{w.id}}">{{w.name}} ({{w.state}})</option>{% endfor %}</select>
<label>Catalog</label><input name="catalog" placeholder="main (opcional)">
<label>Schema</label><input name="schema" placeholder="default (opcional)">
<label>Statement</label><textarea name="statement" rows="5">SELECT 1</textarea>
<button>Executar</button></form>
{% if result %}<h3>Resultado</h3><pre><code>{{result}}</code></pre>{% endif %}{% endblock %}
