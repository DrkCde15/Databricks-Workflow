{% extends "base.html" %}{% block content %}
<h2>Execução ad-hoc — notebook sem criar job</h2>
<div class="card"><form method="post">
<label>Notebook path (WORKSPACE, absoluto)</label>
<input name="notebook_path" required placeholder="/Workspace/Users/voce@empresa.com/MeuNotebook">
<label>Run name</label><input name="run_name" value="adhoc-notebook">
<label>Existing cluster ID (vazio = serverless / job clusters)</label>
<input name="existing_cluster_id" placeholder="ex: 0923-164208-meows279">
<label>Base parameters (um por linha, k=v)</label>
<textarea name="base_parameters" rows="3" placeholder="env=dev"></textarea>
<button>Submeter run</button></form></div>
<p><code>POST /api/2.2/jobs/runs/submit</code> — não aparece como job salvo, só em Runs.</p>
{% endblock %}
