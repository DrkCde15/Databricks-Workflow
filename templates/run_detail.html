{% extends "base.html" %}{% block content %}
<h2>Run <code>{{run.run_id}}</code></h2>
<p>Job: {{run.job_id}} — {{(run.state or {}).life_cycle_state}} / {{(run.state or {}).result_state}}</p>
<p>{{(run.state or {}).state_message}}</p>
<form method="post" action="/runs/{{run.run_id}}/cancel"><button>Cancelar</button></form>
<h3>Output</h3><pre><code>{{output}}</code></pre>
<script>
const id={{run.run_id}};
setInterval(async()=>{const r=await fetch(`/api/runs/${id}/state`).then(r=>r.json());
if(r.life_cycle_state && !['TERMINATED','SKIPPED','INTERNAL_ERROR'].includes(r.life_cycle_state))return;
location.reload();},8000);
</script>{% endblock %}
